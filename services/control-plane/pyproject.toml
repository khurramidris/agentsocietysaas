[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane"
version = "0.1.0"
description = "Multi-tenant control plane: accounts, projects, sandboxes, LLM gateway, billing, datasets, literature search"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "cryptography>=42",
    "httpx>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
docker = ["docker>=7.1"]
kubernetes = ["kubernetes>=29"]
s3 = ["boto3>=1.34"]
# Cross-protocol translation in the LLM gateway (OpenAI-format requests to
# Anthropic, Gemini, Bedrock ... models).
translate = ["litellm>=1.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
all = ["controlplane[docker,kubernetes,s3,translate]"]

[project.scripts]
controlplane = "controlplane.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["controlplane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
