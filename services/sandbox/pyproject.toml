[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandboxd"
version = "0.1.0"
description = "In-sandbox agent that exposes one AgentSociety research workspace to the platform control plane"
requires-python = ">=3.11,<3.14"
# agentsociety2 itself is installed next to this package in the sandbox image
# (from upstream/agentsociety with the pinned lockfile); it is not a dependency
# here so the agent can start and report health even if the engine is broken.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sandboxd = "sandboxd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sandboxd"]

[tool.hatch.build.targets.wheel.force-include]
"sandboxd/templates" = "sandboxd/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
