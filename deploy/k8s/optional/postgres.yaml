# Evaluation only: a single-instance PostgreSQL. Use a managed database in production.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agentsociety
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-bookworm
          env:
            - { name: POSTGRES_DB, value: controlplane }
            - { name: POSTGRES_USER, value: controlplane }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { containerPort: 5432, name: postgres }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "controlplane"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agentsociety
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { port: 5432, targetPort: postgres }
---
# Lets the control plane (and nothing else) reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-controlplane
  namespace: agentsociety
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: controlplane }
      ports:
        - { protocol: TCP, port: 5432 }
